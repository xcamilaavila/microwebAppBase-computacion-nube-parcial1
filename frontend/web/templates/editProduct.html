<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Product</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container" style="padding-top:30px;">
    <h2>Edit Product</h2>
    <a href="/products" class="btn btn-primary mb-3">Back to Products</a>
    <form id="edit-product-form">
        <input type="hidden" id="product-id" value="">
        <div class="form-group">
            <label for="nombre">Nombre</label>
            <input type="text" class="form-control" id="nombre" required>
        </div>
        <div class="form-group">
            <label for="descripcion">Descripción</label>
            <input type="text" class="form-control" id="descripcion">
        </div>
        <div class="form-group">
            <label for="precio">Precio</label>
            <input type="number" step="0.01" class="form-control" id="precio" required>
        </div>
        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" class="form-control" id="stock" required>
        </div>
        <button type="button" class="btn btn-primary" onclick="updateProduct()">Save Changes</button>
    </form>
</div>
<script src="/static/config.js"></script>
<script src="/static/scriptProducts.js"></script>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = {{id}}
    fetch(`${PRODUCTS_API}/api/productos/${productId}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('product-id').value = data.id;
            document.getElementById('nombre').value = data.nombre;
            document.getElementById('descripcion').value = data.descripcion;
            document.getElementById('precio').value = data.precio;
            document.getElementById('stock').value = data.stock;
        })
        .catch(error => console.error('Error:', error));
</script>
</body>
</html>
