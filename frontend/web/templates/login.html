<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body>
<div class="container" style="padding-top:70px; max-width:400px;">
    <h2>Iniciar Sesión</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" class="form-control" id="username" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" class="form-control" id="password" required>
        </div>
        <button type="button" class="btn btn-primary" onclick="login()">Iniciar Sesión</button>
        <p id="login-message" style="margin-top:15px;"></p>
    </form>
</div>
<script src="/static/config.js"></script>
<script src="/static/scriptLogin.js"></script>
<script src="/static/session.js"></script>
<script>
    checkSession(function(data) {
        if (data.logged_in) {
            window.location.href = '/products';
        }
    });
</script>
</body>
</html>
